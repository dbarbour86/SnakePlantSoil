<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | SnakePlantSoil.com</title>
    <meta name="robots" content="noindex, follow" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      h1, h2 {
        font-family: 'Outfit', sans-serif;
      }
    </style>

    <!-- Google Analytics 4 (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      (function() {
        function sanitizeUrl(rawUrl) {
          if (!rawUrl) return '';
          try {
            var parsed = new URL(rawUrl, window.location.origin);
            var sensitive = ['email', 'mail', 'phone', 'token', 'key', 'auth', 'pass', 'name', 'first_name', 'last_name'];
            var params = new URLSearchParams(parsed.search);
            var toDelete = [];
            params.forEach(function(val, key) {
              var k = key.toLowerCase();
              for (var i = 0; i < sensitive.length; i++) {
                if (k.indexOf(sensitive[i]) !== -1) {
                  toDelete.push(key);
                  return;
                }
              }
              if (val.indexOf('@') !== -1 && val.indexOf('.') !== -1) {
                toDelete.push(key);
              }
            });
            toDelete.forEach(function(k) { params.delete(k); });
            parsed.search = params.toString() ? '?' + params.toString() : '';
            return parsed.toString();
          } catch(e) {
            return rawUrl;
          }
        }

        var hostname = window.location.hostname;
        var isProd = hostname === 'snakeplantsoil.com' || hostname === 'www.snakeplantsoil.com';
        var hasSearchDebug = window.location.search.indexOf('ga_debug=true') !== -1;
        var hasSearchDisable = window.location.search.indexOf('ga_debug=false') !== -1;

        if (hasSearchDebug) {
          try { sessionStorage.setItem('ga_debug', 'true'); } catch(e){}
        } else if (hasSearchDisable) {
          try { sessionStorage.removeItem('ga_debug'); } catch(e){}
        }

        var isDebug = hasSearchDebug || (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('ga_debug') === 'true');

        if (isDebug) {
          // Explicitly clear disable flag for local debugging
          window['ga-disable-G-TC5QZQM7DR'] = false;
          try { delete window['ga-disable-G-TC5QZQM7DR']; } catch(e){}
        } else if (!isProd) {
          window['ga-disable-G-TC5QZQM7DR'] = true;
          return;
        }

        var cleanLocation = sanitizeUrl(window.location.href);
        var cleanReferrer = sanitizeUrl(document.referrer);

        gtag('js', new Date());
        gtag('set', {
          page_location: cleanLocation,
          page_referrer: cleanReferrer
        });
        gtag('config', 'G-TC5QZQM7DR', {
          send_page_view: false,
          page_location: cleanLocation,
          page_referrer: cleanReferrer,
          debug_mode: isDebug
        });

        // Explicitly send page_view since send_page_view: false is used and App.tsx does not run on standalone 404
        gtag('event', 'page_view', {
          page_title: '404 - Page Not Found | SnakePlantSoil.com',
          page_location: cleanLocation,
          page_referrer: cleanReferrer,
          page_path: window.location.pathname,
          debug_mode: isDebug
        });

        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-TC5QZQM7DR';
        var first = document.getElementsByTagName('script')[0];
        first.parentNode.insertBefore(s, first);
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-850 min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full text-center space-y-6">
      <div class="w-24 h-24 bg-emerald-50 text-emerald-800 rounded-3xl flex items-center justify-center mx-auto text-3xl font-extrabold font-mono border border-emerald-100 shadow-xs">
        404
      </div>
      <div class="space-y-2">
        <h1 class="text-3xl font-extrabold text-stone-900 tracking-tight">Guide Not Found</h1>
        <p class="text-stone-500 text-sm max-w-sm mx-auto leading-relaxed">
          The requested snake plant care page could not be located. It may have been moved, deleted, or had its URL updated.
        </p>
      </div>
      <div class="pt-4">
        <a 
          href="https://snakeplantsoil.com/" 
          class="inline-flex items-center justify-center bg-emerald-800 hover:bg-emerald-950 text-white font-bold px-6 py-3 rounded-xl text-sm transition-all shadow-xs"
        >
          ← Return to Home Portal
        </a>
      </div>
    </div>
  </body>
</html>
